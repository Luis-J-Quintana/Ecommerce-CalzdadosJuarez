services:
  postgres:
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER}
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"
    
    networks:
      - calzadosjuarez-network

    volumes:
      - calzadosjuarez_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: ${REDIS_CONTAINER}
    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"
    
    networks:
      - calzadosjuarez-network

networks:
  calzadosjuarez-network:

volumes:
  calzadosjuarez_postgres_data:
